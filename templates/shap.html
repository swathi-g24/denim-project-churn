{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm border-0">
    <div class="card-body text-center">
        <h2 class="mb-3">SHAP Explanation</h2>
        <p class="text-muted">The chart below highlights which features most influenced the prediction for {{ latest.student_id }}.</p>
        <img src="{{ url_for('static', filename='plots/latest_shap.png') }}" class="img-fluid rounded" alt="SHAP explanation">
        <div class="mt-4">
            <h4>{{ latest.label }}</h4>
            <p class="lead">Probability: {{ latest.probability }}</p>
            <p>{{ latest.recommendation }}</p>
        </div>
    </div>
</div>
{% endblock %}
